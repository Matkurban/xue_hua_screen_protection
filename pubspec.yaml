name: xue_hua_screen_protection
description: "Flutter plugin for screen privacy: anti-screenshot, anti-recording, capture detection, app-switcher blur, and security watermarks."
version: 1.0.1
homepage: https://github.com/Matkurban/xue_hua_screen_protection
repository: https://github.com/Matkurban/xue_hua_screen_protection
issue_tracker: https://github.com/Matkurban/xue_hua_screen_protection/issues
documentation: https://github.com/Matkurban/xue_hua_screen_protection#readme

topics:
  - security
  - privacy
  - screenshot
  - screen-recording
  - watermark

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.2
  material_ui: ^1.8.0
  plugin_platform_interface: ^2.1.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.kurban.xue_hua_screen_protection
        pluginClass: XueHuaScreenProtectionPlugin
      ios:
        pluginClass: XueHuaScreenProtectionPlugin
      linux:
        pluginClass: XueHuaScreenProtectionPlugin
      macos:
        pluginClass: XueHuaScreenProtectionPlugin
      windows:
        pluginClass: XueHuaScreenProtectionPluginCApi
      web:
        pluginClass: XueHuaScreenProtectionWeb
        fileName: xue_hua_screen_protection_web.dart
