name: xue_hua_screen_protection_example
description: "Demonstrates how to use the xue_hua_screen_protection plugin across Android, iOS, macOS, Windows, Linux, and Web."
publish_to: 'none'

environment:
  sdk: ^3.13.0
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  xue_hua_screen_protection:
    path: ../
  cupertino_icons: ^2.0.0
  material_ui: ^1.8.0

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  test: any

flutter:
  uses-material-design: true
